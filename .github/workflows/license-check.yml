# SPDX-License-Identifier: Apache-2.0
# License drift detection — blocks references to non-commercial-licensed
# vendor weights / source trees in the OSS distribution.
#
# The blocked vendor / model-name prefixes are not stored in this repo:
# they come from the `NC_VENDOR_PATTERNS` repository variable (newline-
# separated, `#` comments allowed), so a blocked string never has to appear
# in the tree in order to be blocked.
#
# A string grep only catches what someone named. It is not a substitute for
# reviewing the licence of anything new you vendor, embed or link.
#
# Triggered on every push + half-yearly cron.

name: License Check

on:
  push:
  schedule:
    # Twice a year: force a re-audit at 00:00 UTC on 1 January and 1 July.
    - cron: "0 0 1 1,7 *"
  workflow_dispatch:

jobs:
  license-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load blocked vendor patterns
        id: pattern
        env:
          NC_VENDOR_PATTERNS: ${{ vars.NC_VENDOR_PATTERNS }}
        run: |
          set -eu
          SOURCE=""
          if [ -n "${NC_VENDOR_PATTERNS:-}" ]; then
            SOURCE="$NC_VENDOR_PATTERNS"
          elif [ -f ".github/nc-vendor-patterns.txt" ]; then
            # Legacy fallback for clones that still carry a local file.
            SOURCE=$(cat ".github/nc-vendor-patterns.txt")
          fi
          if [ -z "$SOURCE" ]; then
            echo "::warning::NC_VENDOR_PATTERNS repository variable is not set — skipping NC vendor check"
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Join non-empty, non-comment lines with `|`
          PATTERN=$(printf '%s\n' "$SOURCE" | grep -vE '^\s*(#|$)' | paste -sd '|' -)
          if [ -z "$PATTERN" ]; then
            echo "::error::NC vendor pattern source has no usable entries"
            exit 1
          fi
          # Mask the resolved pattern in subsequent log output so the
          # vendor names never surface in CI logs.
          echo "::add-mask::$PATTERN"
          echo "value=$PATTERN" >> "$GITHUB_OUTPUT"

      - name: Block NC / non-commercial vendor references
        if: steps.pattern.outputs.value != ''
        env:
          PATTERN: ${{ steps.pattern.outputs.value }}
        run: |
          set -eu
          if grep -rEn "$PATTERN" \
              --include="*.py" --include="*.ts" --include="*.tsx" --include="*.md" \
              --include="*.yaml" --include="*.yml" --include="*.json" --include="*.toml" \
              --exclude-dir=".git" --exclude-dir=".venv*" --exclude-dir="node_modules" \
              --exclude-dir="dist" --exclude-dir="build" \
              --exclude=".github/nc-vendor-patterns.txt" \
              --exclude="license-check.yml" \
              --exclude="pre-commit" \
              .; then
            echo "::error::Non-commercial vendor reference detected — see grep hits above"
            echo "Apache-2.0 OSS cannot bundle non-commercial-licensed weights or source."
            exit 1
          fi
          echo "✅ no non-commercial vendor references"

      - name: Dependency license gate (PyPI metadata)
        run: |
          python3 scripts/ci/check_dep_licenses.py \
            apps/api/requirements.txt \
            apps/api/requirements-cu130.txt \
            apps/api/requirements-openvino.txt \
            --allowlist scripts/ci/dep-license-allowlist.txt

      - name: Install osv-scanner (pinned, SHA-256 verified)
        # The Python gate above reads PyPI metadata and cannot see the npm
        # tree. osv-scanner resolves npm licenses via deps.dev, closing the
        # copyleft (AGPL/GPL/SSPL/...) gap on the JS side. Pinned + checksum-
        # verified to match the release-download discipline used elsewhere.
        run: |
          set -eu
          ver=2.4.0
          sha=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          url="https://github.com/google/osv-scanner/releases/download/v${ver}/osv-scanner_linux_amd64"
          curl -fsSL "$url" -o /tmp/osv-scanner
          echo "${sha}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner

      - name: npm dependency license gate (copyleft/AGPL)
        run: |
          python3 scripts/ci/check_npm_licenses.py \
            apps/ui/package-lock.json \
            --osv-scanner /tmp/osv-scanner

      - name: Verify LICENSE file exists
        run: |
          test -f LICENSE || { echo "::error::LICENSE file missing"; exit 1; }
          echo "✅ LICENSE present"
